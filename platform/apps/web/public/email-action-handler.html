<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifying — Glampack HR</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: #f4f4f2;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 400px;
        background: #ffffff;
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03), 0 16px 32px -16px rgba(0, 0, 0, 0.12);
      }
      .spinner {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1.5rem;
        border-radius: 999px;
        border: 3px solid #f1d4d4;
        border-top-color: #c81e3a;
        animation: spin 0.8s linear infinite;
      }
      .icon {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1.5rem;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
      }
      .icon.success { background: #e3f5ea; color: #1a9c53; }
      .icon.error { background: #fbe7e7; color: #c81e3a; }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { margin: 0 0 0.5rem; font-size: 1.375rem; font-weight: 700; color: #17181a; }
      p { margin: 0; font-size: 0.9rem; color: #6b6d70; line-height: 1.5; }
      .redirect { margin-top: 1.25rem; font-size: 0.8rem; color: #8a8c8f; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner" id="spinner"></div>
      <h1 id="heading">Processing…</h1>
      <p id="message">Please wait while we verify your request.</p>
      <p class="redirect" id="redirect" style="display: none"></p>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
      import {
        getAuth,
        verifyPasswordResetCode,
        applyActionCode,
      } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCBOQG9SGC73eAxXPjY7w-qLSw4RQUtKvI",
        authDomain: "packaging-glamour-hr.firebaseapp.com",
        projectId: "packaging-glamour-hr",
        storageBucket: "packaging-glamour-hr.firebasestorage.app",
        messagingSenderId: "30061300056",
        appId: "1:30061300056:web:3274d4a0138ea18745bd2d",
      };
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode");
      const oobCode = params.get("oobCode");

      const heading = document.getElementById("heading");
      const message = document.getElementById("message");
      const spinner = document.getElementById("spinner");
      const redirect = document.getElementById("redirect");

      function showIcon(kind) {
        spinner.outerHTML = `<div class="icon ${kind}" id="spinner">${kind === "success" ? "✓" : "✕"}</div>`;
      }

      function goTo(path, delayMs = 1200) {
        redirect.style.display = "block";
        let seconds = Math.ceil(delayMs / 1000);
        redirect.textContent = `Redirecting in ${seconds}…`;
        const interval = setInterval(() => {
          seconds -= 1;
          if (seconds <= 0) {
            clearInterval(interval);
            window.location.href = path;
          } else {
            redirect.textContent = `Redirecting in ${seconds}…`;
          }
        }, 1000);
      }

      function showError(err) {
        showIcon("error");
        heading.textContent = "Link invalid or expired";
        const known = {
          "auth/expired-action-code": "This link has expired. Please request a new one.",
          "auth/invalid-action-code": "This link is invalid or has already been used.",
          "auth/user-disabled": "This account has been disabled.",
          "auth/user-not-found": "No account found for this link.",
        };
        message.textContent = known[err?.code] || "Something went wrong. Please request a new link.";
        goTo("/sign-in", 2500);
      }

      async function run() {
        if (!mode || !oobCode) {
          showError({});
          return;
        }

        try {
          if (mode === "resetPassword") {
            heading.textContent = "Verifying reset link…";
            message.textContent = "One moment while we confirm your request.";
            await verifyPasswordResetCode(auth, oobCode);
            // The real reset form lives in the app — hand off the already-verified code.
            window.location.href = `/reset-password?oobCode=${encodeURIComponent(oobCode)}`;
            return;
          }

          if (mode === "verifyEmail" || mode === "recoverEmail") {
            heading.textContent = mode === "verifyEmail" ? "Verifying email…" : "Recovering email…";
            await applyActionCode(auth, oobCode);
            showIcon("success");
            heading.textContent = mode === "verifyEmail" ? "Email verified!" : "Email recovered!";
            message.textContent = "You're all set.";
            goTo("/sign-in");
            return;
          }

          showError({});
        } catch (err) {
          showError(err);
        }
      }

      run();
    </script>
  </body>
</html>
